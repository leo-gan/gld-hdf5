# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: "0.1.0"

package:
  name: mojo-hdf5
  version: ${{ version }}

source:
  path: ..

build:
  number: 0
  script:
    - mkdir -p ${{ PREFIX }}/lib/mojo ${{ PREFIX }}/bin
    - mojo precompile -I src src/runtime -o ${{ PREFIX }}/lib/mojo/runtime.mojoc
    - mojo precompile -I src src/wire -o ${{ PREFIX }}/lib/mojo/wire.mojoc
    - mojo precompile -I src src/schema -o ${{ PREFIX }}/lib/mojo/schema.mojoc
    - mojo precompile -I src src/hdf5 -o ${{ PREFIX }}/lib/mojo/hdf5.mojoc
    - mojo build -I src src/codegen/cli.mojo -o ${{ PREFIX }}/bin/gld-hdf5gen-mojo

requirements:
  build:
    - mojo-compiler ==1.1.0
  host:
    - mojo-compiler ==1.1.0
  run:
    - ${{ pin_compatible('mojo-compiler') }}

tests:
  - script:
      - if: unix
        then:
          - mojo run test_import.mojo
          - gld-hdf5gen-mojo --help
    files:
      recipe:
        - test_import.mojo

about:
  homepage: https://leo-gan.github.io/gld-hdf5/
  repository: https://github.com/leo-gan/gld-hdf5
  documentation: https://leo-gan.github.io/gld-hdf5/
  license: MIT
  license_file: LICENSE
  summary: From-scratch HDF5, NetCDF, and ADIOS2 BP5 library for Mojo
  description: |
    Runtime and code generator written in Mojo. Does not wrap a C, C++, or
    Rust HDF5, NetCDF, or ADIOS2 library. The package installs hdf5.mojoc
    (plus wire, runtime, and schema) and the gld-hdf5gen-mojo CLI.
